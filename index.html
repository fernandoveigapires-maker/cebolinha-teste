<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cebolinha — Teste GitHub</title><style> *{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#203b30;font:16px system-ui}header{background:#285744;color:white;padding:22px;text-align:center}h1{margin:0}main{max-width:800px;margin:auto;padding:16px}section,article{background:white;border:1px solid #dce5df;border-radius:12px;padding:16px;margin-bottom:14px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;border-radius:8px;padding:10px}input,textarea{width:100%;border:1px solid #a9b9ae}button{background:#285744;color:white;border:0;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5}button.secondary{background:#e4ece6;color:#203b30}small{color:#52685b}#msg{white-space:pre-wrap} [hidden]{display:none!important}</style></head><body><header><h1>🐾 Cebolinha</h1>Teste 1.0 · GitHub</header><main><section id="login"><h2>Conectar ao banco de teste</h2><label>Token de acesso GitHub<input id="key" type="password" autocomplete="off" spellcheck="false"></label><button id="connect">Conectar</button><p><small>Use apenas o token restrito ao repositório de teste. A chave permanece na memória desta página e não é gravada no navegador.</small></p></section><p id="msg" role="status" aria-live="polite"></p><section id="panel" hidden><button id="reload">Atualizar registros</button><button id="exit" class="secondary">Sair</button><p id="summary"></p><div id="records"></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);const url='https://api.github.com/repos/fernandoveigapires-maker/cebolinha-dados-teste/contents/dados.json';let token='',busy=false,model=null;function msg(t){$('msg').textContent=t}function lock(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v)}async function api(method='GET',body){const r=await fetch(url+'?ref=main',{method,cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('GitHub: HTTP '+r.status+(r.status===401?' — token inválido ou expirado':r.status===404?' — confira o repositório, arquivo e permissões':r.status===409||r.status===422?' — conflito de gravação; atualize e tente novamente':''));return r.json()}async function read(){const f=await api();const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));if(!Array.isArray(data.registros))throw Error('Formato de dados.json inválido');return {data,sha:f.sha}}function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}function field(parent,label,type,value){const l=node('label',label),i=node(type==='textarea'?'textarea':'input');if(type!=='textarea')i.type=type;if(type==='number')i.step='0.1';i.value=value??'';l.append(i);parent.append(l);return i}function render(){const root=$('records');root.replaceChildren();$('summary').textContent=model.data.registros.length+' registros · '+model.data.registros.filter(r=>r.temp!==''&&r.data).length+' preenchidos';for(const r of model.data.registros){const a=node('article');a.append(node('h3',r.semana+' · '+r.dia),node('p',r.med),node('p',r.momento));const t=field(a,'Temperatura (°C)','number',r.temp),d=field(a,'Data','date',r.data),o=field(a,'Observações','textarea',r.obs);const save=node('button','Salvar'),clear=node('button','Limpar registro');clear.className='secondary';save.onclick=()=>{if(!t.checkValidity()||!d.checkValidity()){msg('Confira os campos.');return}write(r,{temp:t.value===''?'':Number(t.value),data:d.value,obs:o.value})};clear.onclick=()=>{if(confirm('Limpar temperatura, data e observações deste registro?'))write(r,{temp:'',data:'',obs:''})};a.append(save,clear);root.append(a)}}async function write(old,values){if(busy)return;lock(true);try{const latest=await read();const r=latest.data.registros.find(x=>x.linha===old.linha);if(!r||['temp','data','obs'].some(k=>r[k]!==old[k]))throw Error('Registro alterado em outro aparelho. Atualize antes de salvar.');Object.assign(r,values);const bytes=new TextEncoder().encode(JSON.stringify(latest.data,null,2)+'\n');let bin='';for(const b of bytes)bin+=String.fromCharCode(b);await api('PUT',{message:'Atualizar registro de teste '+old.linha,content:btoa(bin),sha:latest.sha,branch:'main'});model=await read();render();msg('Registro salvo no GitHub.')}catch(e){msg(e.message)}finally{lock(false)}}async function load(){if(busy)return;lock(true);try{model=await read();render();$('login').hidden=true;$('panel').hidden=false;msg('Banco de teste conectado.')}catch(e){msg(e.message)}finally{lock(false)}}$('connect').onclick=()=>{token=$('key').value.trim();$('key').value='';if(!token){msg('Informe o token.');return}load()};$('reload').onclick=load;$('exit').onclick=()=>{token='';model=null;$('records').replaceChildren();$('panel').hidden=true;$('login').hidden=false;msg('Sessão encerrada.')};</script></body></html>
